name: Paper ladder

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: paper-ladder
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the technical vote uses
        run: pip install numpy pydantic pytest

      - name: Run the paper checks
        run: python -m pytest live/judge/test_judge.py --noconftest -q

  judge:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the technical vote uses
        run: pip install numpy pydantic

      - name: Judge yesterday and catch up
        run: python live/judge/run.py

      - name: Commit the ledger and the status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/ledger.jsonl live/STATUS.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Paper ladder $(date -u +%Y-%m-%d)"
          git push origin HEAD
